version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8
    container_name: billova-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: billova
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - billova-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: billova-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/billova
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      # Supabase Configuration
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_SHADOW_WRITE: ${SUPABASE_SHADOW_WRITE:-true}
      DUAL_AUTH_ENABLED: ${DUAL_AUTH_ENABLED:-true}
      SUPABASE_AUTH_ONLY: ${SUPABASE_AUTH_ONLY:-false}
    networks:
      - billova-network
    expose:
      - "3002"

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: billova-web
    restart: always
    depends_on:
      - api
    networks:
      - billova-network
    expose:
      - "80"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: billova-nginx
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - billova-network

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: billova-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mysql_data:


networks:
  billova-network:
    driver: bridge
